# Prometheus (dev). Every ScoutOSS service exposes /metrics; alert rules are loaded but no
# Alertmanager is wired in dev ("documented, dev-off") — see docs/runbook.md#alerting.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels: { environment: dev, stack: scoutoss }
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: indexer
    static_configs: [{ targets: ["indexer:8000"] }]
  - job_name: copilot
    static_configs: [{ targets: ["copilot:8000"] }]
  - job_name: deid-gateway
    static_configs: [{ targets: ["deid-gateway:8001"] }]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs: [{ targets: ["keycloak:9000"] }]
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs: [{ targets: ["localhost:9090"] }]
