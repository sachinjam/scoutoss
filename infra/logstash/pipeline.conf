# Filebeat (beats protocol) -> Logstash OSS -> OpenSearch logs-YYYY.MM.dd.
# Filebeat 7.x cannot write to OpenSearch 2.x directly (it sends the removed _type bulk
# parameter); this is the path OpenSearch documents for Beats.
input {
  beats { port => 5044 }
}
filter {
  mutate { remove_field => ["@version", "tags", "agent", "ecs", "host", "input", "log", "stream", "container"] }
}
output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    ecs_compatibility => disabled
  }
}
