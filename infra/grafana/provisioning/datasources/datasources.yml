apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090/prometheus
    isDefault: true
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686/jaeger
  - name: OpenSearch logs
    uid: logs
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    jsonData: { database: "logs-*", timeField: "ts", flavor: opensearch, version: "2.19.3" }
