{{- if .Values.networkPolicy.enabled }}
# Default deny ingress; only the documented flows are allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "scoutoss.fullname" . }}-default-deny
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } }
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "scoutoss.fullname" . }}-allow
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
      ports: [{ port: 8000 }, { port: 8080 }]
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } } }]
      ports: [{ port: 8000 }]
    - ports: [{ port: 11112 }, { port: 6661 }]   # DICOM / MLLP from site networks (restrict at the LB)
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 8000 }, { port: 8001 }]
{{- end }}
