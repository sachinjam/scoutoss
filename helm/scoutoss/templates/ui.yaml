{{- $name := "ui" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scoutoss.fullname" . }}-{{ $name }}
  labels: {{- include "scoutoss.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels: {{- include "scoutoss.selector" (dict "root" . "name" $name) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "scoutoss.selector" (dict "root" . "name" $name) | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ui
          image: {{ include "scoutoss.image" (dict "root" . "name" "ui") }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: KEYCLOAK_PUBLIC_URL, value: "https://{{ .Values.hosts.auth }}" }
            - { name: KEYCLOAK_REALM, value: scoutoss }
            - { name: KEYCLOAK_CLIENT_ID, value: scoutoss-ui }
            - { name: DEFAULT_PROJECT, value: {{ .Values.global.defaultProject | quote }} }
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
      volumes: [{ name: tmp, emptyDir: {} }, { name: cache, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scoutoss.fullname" . }}-{{ $name }}
  labels: {{- include "scoutoss.labels" . | nindent 4 }}
spec:
  selector: {{- include "scoutoss.selector" (dict "root" . "name" $name) | nindent 4 }}
  ports: [{ name: http, port: 8080, targetPort: http }]
