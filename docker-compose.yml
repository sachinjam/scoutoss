# ScoutOSS development stack. `make up` generates .env + TLS certs, fetches XNAT plugins,
# then runs `docker compose up -d --build --wait`.
# Only nginx (HTTPS), the de-identification gateway (DICOM) and Mirth (MLLP) publish
# ports, and only on 127.0.0.1. Everything else is reachable only on the internal network.
name: scoutoss

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5", labels: "scoutoss.service" }

x-python-env: &python-env
  ENV: ${ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OPENSEARCH_URL: http://opensearch:9200
  DEFAULT_PROJECT: ${DEFAULT_PROJECT:-SCOUT_DEMO}
  AUTH_ISSUER: https://auth.localhost:${HTTPS_PORT:-24443}/realms/scoutoss
  AUTH_JWKS_URL: http://keycloak:8080/realms/scoutoss/protocol/openid-connect/certs
  XNAT_URL: http://xnat-web:8080
  XNAT_PUBLIC_URL: https://xnat.localhost:${HTTPS_PORT:-24443}

services:
  # ------------------------------------------------------------------ edge
  proxy:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.29-alpine
    ports:
      - "127.0.0.1:${HTTPS_PORT:-24443}:8443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-24443}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/html:/usr/share/nginx/scoutoss:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    labels: { scoutoss.service: proxy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:8443/ 2>&1 | grep -q 301 || nc -z 127.0.0.1 8443"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      keycloak: { condition: service_healthy }

  # ------------------------------------------------------------------ databases
  scout-db:
    <<: *hardening
    image: postgres:15.20-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      SCOUT_APP_DB_PASSWORD: ${SCOUT_APP_DB_PASSWORD}
      DEID_DB_PASSWORD: ${DEID_DB_PASSWORD}
      COPILOT_DB_PASSWORD: ${COPILOT_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      MIRTH_DB_PASSWORD: ${MIRTH_DB_PASSWORD}
    volumes:
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-scoutoss.sh:ro
      - scout-db:/var/lib/postgresql/data
    labels: { scoutoss.service: scout-db }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scoutoss"]
      interval: 5s
      timeout: 5s
      retries: 30

  xnat-db:
    <<: *hardening
    image: postgres:15.20-alpine
    environment:
      POSTGRES_DB: xnat
      POSTGRES_USER: xnat
      POSTGRES_PASSWORD: ${XNAT_DB_PASSWORD}
    volumes:
      - xnat-db:/var/lib/postgresql/data
    labels: { scoutoss.service: xnat-db }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xnat -d xnat"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ------------------------------------------------------------------ XNAT archive of record
  xnat-web:
    <<: *hardening
    image: ghcr.io/nrgxnat/xnat:1.10.2.1
    platform: linux/amd64
    entrypoint: ["/bin/sh", "/usr/local/bin/xnat-start.sh"]
    user: "1000:1000"
    environment:
      CATALINA_OPTS: -Xms512m -Xmx${XNAT_MAX_HEAP:-3g} -Dxnat.home=/data/xnat/home
      XNAT_HOME: /data/xnat/home
      XNAT_DB_PASSWORD: ${XNAT_DB_PASSWORD}
      XNAT_PUBLIC_URL: https://xnat.localhost:${HTTPS_PORT:-24443}
      KC_XNAT_CLIENT_SECRET: ${KC_XNAT_CLIENT_SECRET}
      KEYCLOAK_PUBLIC_ISSUER: https://auth.localhost:${HTTPS_PORT:-24443}/realms/scoutoss
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/scoutoss
      TZ: Etc/UTC
    volumes:
      - ./xnat/xnat-start.sh:/usr/local/bin/xnat-start.sh:ro
      - ./xnat/plugins:/plugins:ro
      - xnat-home:/data/xnat/home
      - xnat-archive:/data/xnat/archive
      - xnat-prearchive:/data/xnat/prearchive
      - xnat-build:/data/xnat/build
      - xnat-cache:/data/xnat/cache
    labels: { scoutoss.service: xnat-web }
    depends_on:
      xnat-db: { condition: service_healthy }
      job-engine: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/xapi/siteConfig/buildInfo -w '%{http_code}' | grep -qE '200|401' || curl -fsS -o /dev/null http://localhost:8080/"]
      interval: 20s
      timeout: 15s
      retries: 60
      start_period: 900s

  # Isolated Docker engine for XNAT Container Service jobs (XNAT never gets the host socket).
  job-engine:
    restart: unless-stopped
    image: docker:29.0.4-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--tls=false"]
    volumes:
      - job-engine:/var/lib/docker
      - xnat-archive:/data/xnat/archive
      - xnat-build:/data/xnat/build
    labels: { scoutoss.service: job-engine }
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------ search
  opensearch:
    <<: *hardening
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      cluster.name: scoutoss
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"   # dev only; Helm enables the security plugin + TLS
      action.auto_create_index: "-dicom_*,-clinical_events,-audit,+*"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch:/usr/share/opensearch/data
    labels: { scoutoss.service: opensearch }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  opensearch-dashboards:
    <<: *hardening
    image: opensearchproject/opensearch-dashboards:2.19.3
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      SERVER_BASEPATH: /dashboards
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: https://app.localhost:${HTTPS_PORT:-24443}/dashboards
    labels: { scoutoss.service: opensearch-dashboards }
    depends_on:
      opensearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/dashboards/api/status | grep -q '\"state\":\"green\"'"]
      interval: 15s
      timeout: 10s
      retries: 40

  # ------------------------------------------------------------------ identity
  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.8.2
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --hostname=https://auth.localhost:${HTTPS_PORT:-24443}
      - --hostname-backchannel-dynamic=true
      - --proxy-headers=xforwarded
      - --health-enabled=true
      - --metrics-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://scout-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_LOG_CONSOLE_OUTPUT: json
      HTTPS_PORT: ${HTTPS_PORT:-24443}
      KC_COPILOT_CLIENT_SECRET: ${KC_COPILOT_CLIENT_SECRET}
      KC_INDEXER_CLIENT_SECRET: ${KC_INDEXER_CLIENT_SECRET}
      KC_MIRTH_CLIENT_SECRET: ${KC_MIRTH_CLIENT_SECRET}
      KC_DASHBOARDS_CLIENT_SECRET: ${KC_DASHBOARDS_CLIENT_SECRET}
      KC_NOTEBOOKS_CLIENT_SECRET: ${KC_NOTEBOOKS_CLIENT_SECRET}
      KC_XNAT_CLIENT_SECRET: ${KC_XNAT_CLIENT_SECRET}
      KC_XNAT_SYNC_CLIENT_SECRET: ${KC_XNAT_SYNC_CLIENT_SECRET}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/scoutoss-realm.json:ro
    labels: { scoutoss.service: keycloak }
    depends_on:
      scout-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  oauth2-proxy:
    <<: *hardening
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    command:
      - --provider=keycloak-oidc
      - --client-id=scoutoss-dashboards
      - --skip-oidc-discovery=true
      - --oidc-issuer-url=https://auth.localhost:${HTTPS_PORT:-24443}/realms/scoutoss
      - --login-url=https://auth.localhost:${HTTPS_PORT:-24443}/realms/scoutoss/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/scoutoss/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/scoutoss/protocol/openid-connect/certs
      - --validate-url=http://keycloak:8080/realms/scoutoss/protocol/openid-connect/userinfo
      - --redirect-url=https://app.localhost:${HTTPS_PORT:-24443}/oauth2/callback
      - --code-challenge-method=S256
      - --allowed-role=viewer
      - --allowed-role=researcher
      - --allowed-role=admin
      - --email-domain=*
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=8h
      - --whitelist-domain=app.localhost:${HTTPS_PORT:-24443}
      - --upstream=static://202
      - --http-address=0.0.0.0:4180
      - --skip-provider-button=true
      - --insecure-oidc-allow-unverified-email=true
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${KC_DASHBOARDS_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
    labels: { scoutoss.service: oauth2-proxy }
    depends_on:
      keycloak: { condition: service_healthy }

  # ------------------------------------------------------------------ observability
  jaeger:
    <<: *hardening
    image: jaegertracing/jaeger:2.19.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./infra/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    labels: { scoutoss.service: jaeger }

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.external-url=https://app.localhost:${HTTPS_PORT:-24443}/prometheus/
      - --web.route-prefix=/prometheus
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    labels: { scoutoss.service: prometheus }

  grafana:
    <<: *hardening
    image: grafana/grafana:12.2.10
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://app.localhost:${HTTPS_PORT:-24443}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    labels: { scoutoss.service: grafana }

  logstash:
    <<: *hardening
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx512m
      PIPELINE_ECS_COMPATIBILITY: disabled
    volumes:
      - ./infra/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    labels: { scoutoss.service: logstash }
    depends_on:
      opensearch: { condition: service_healthy }

  # Log shipper. Runs as root: it must read Docker's container log files (documented
  # exception in docs/compliance.md; it has read-only mounts and no published ports).
  filebeat:
    <<: *hardening
    image: docker.elastic.co/beats/filebeat-oss:7.12.1
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./infra/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - filebeat:/usr/share/filebeat/data
    labels: { scoutoss.service: filebeat }
    depends_on:
      logstash: { condition: service_started }

  # ------------------------------------------------------------------ ScoutOSS services
  # Mirrors Keycloak groups /projects/<ID> into XNAT's read-only collaborator role, so users who
  # arrive in XNAT/OHIF through single sign-on can see exactly the projects the copilot shows them.
  xnat-access-sync:
    <<: *hardening
    image: scoutoss/indexer:${SCOUTOSS_TAG:-dev}
    command: ["scoutoss-indexer", "xnat-access-sync"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *python-env
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: scoutoss
      KC_XNAT_SYNC_CLIENT_SECRET: ${KC_XNAT_SYNC_CLIENT_SECRET}
      XNAT_URL: http://xnat-web:8080
      XNAT_ADMIN_PASSWORD: ${XNAT_ADMIN_PASSWORD}
      ACCESS_SYNC_SECONDS: "5"
    labels: { scoutoss.service: xnat-access-sync }
    depends_on:
      keycloak: { condition: service_healthy }
      xnat-setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys;sys.exit(time.time()-os.path.getmtime('/tmp/xnat-access-sync.ok')>120)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  # Launches pipelines on a study when it arrives (XNAT has archived its session), once per
  # session, paced and audited like a cohort launch. AUTO_RUN_PIPELINES: wrapper names, optionally
  # limited to modalities ("scoutoss-qc-session,other:CT+MR"); set it to "none" to switch it off.
  auto-run:
    <<: *hardening
    image: scoutoss/indexer:${SCOUTOSS_TAG:-dev}
    command: ["scoutoss-indexer", "auto-run"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *python-env
      DATABASE_URL: postgresql://scout_app:${SCOUT_APP_DB_PASSWORD}@scout-db:5432/scoutoss
      XNAT_USER: scout_pipeline
      XNAT_PASSWORD: ${XNAT_PIPELINE_PASSWORD}
      AUTO_RUN_PIPELINES: ${AUTO_RUN_PIPELINES:-scoutoss-qc-session}
      AUTO_RUN_EXISTING: ${AUTO_RUN_EXISTING:-skip}
      AUTO_RUN_SECONDS: "10"
    labels: { scoutoss.service: auto-run }
    depends_on:
      scout-db: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      xnat-setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys;sys.exit(time.time()-os.path.getmtime('/tmp/auto-run.ok')>300)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  # Sends AI results that pipelines leave in the session resource AI_DICOM to a DICOM destination.
  # Point DICOM_EXPORT_HOST / _PORT / _AE at a research PACS; the default is the dev server below.
  # Objects go out exactly as de-identified as XNAT holds them (no re-identification).
  dicom-export:
    <<: *hardening
    image: scoutoss/indexer:${SCOUTOSS_TAG:-dev}
    command: ["scoutoss-indexer", "dicom-export"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *python-env
      DATABASE_URL: postgresql://scout_app:${SCOUT_APP_DB_PASSWORD}@scout-db:5432/scoutoss
      XNAT_USER: scout_indexer
      XNAT_PASSWORD: ${XNAT_INDEXER_PASSWORD}
      DICOM_EXPORT_HOST: ${DICOM_EXPORT_HOST:-dicom-dest}
      DICOM_EXPORT_PORT: ${DICOM_EXPORT_PORT:-4242}
      DICOM_EXPORT_AE: ${DICOM_EXPORT_AE:-RESEARCHPACS}
      DICOM_EXPORT_CALLING_AE: ${DICOM_EXPORT_CALLING_AE:-SCOUTOSS}
      DICOM_EXPORT_SECONDS: "10"
    labels: { scoutoss.service: dicom-export }
    depends_on:
      scout-db: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      xnat-setup: { condition: service_completed_successfully }
      dicom-dest: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys;sys.exit(time.time()-os.path.getmtime('/tmp/dicom-export.ok')>300)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  # Dev stand-in for the DICOM destination (a research PACS): Orthanc, AE RESEARCHPACS. Its DICOM
  # port is reachable only inside the compose network; the web UI is on localhost with a login.
  dicom-dest:
    <<: *hardening
    image: orthancteam/orthanc:25.9.0
    ports:
      - "127.0.0.1:${ORTHANC_PORT:-28042}:8042"
    environment:
      ORTHANC__NAME: ScoutOSS dev research PACS
      ORTHANC__DICOM_AET: RESEARCHPACS
      ORTHANC__DICOM_CHECK_CALLED_AET: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_FIND: "true"   # dicom-export verifies its sends with C-FIND
      ORTHANC__OVERWRITE_INSTANCES: "true"       # a re-run result replaces the earlier one
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"scout": "${ORTHANC_PASSWORD}"}'
    labels: { scoutoss.service: dicom-dest }
    volumes:
      - dicom-dest:/var/lib/orthanc/db

  deid-gateway:
    <<: *hardening
    build: { context: ., dockerfile: services/indexer/Dockerfile }
    image: scoutoss/indexer:${SCOUTOSS_TAG:-dev}
    command: ["scoutoss-indexer", "gateway"]
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:${DICOM_PORT:-24112}:11112"
    environment:
      <<: *python-env
      PORT: "8001"
      GATEWAY_AE_TITLE: SCOUTGW
      GATEWAY_PORT: "11112"
      GATEWAY_SPOOL: /spool
      XNAT_DICOM_HOST: xnat-web
      XNAT_DICOM_PORT: "8104"
      XNAT_DICOM_AE: XNAT
      GATEWAY_PROJECT_MAP: '{"${DEFAULT_PROJECT:-SCOUT_DEMO}": "${DEFAULT_PROJECT:-SCOUT_DEMO}"}'
      GATEWAY_RETRY_SECONDS: "15"
      XNAT_ARCHIVER_USER: scout_archiver
      XNAT_ARCHIVER_PASSWORD: ${XNAT_ARCHIVER_PASSWORD}
      DEID_HMAC_SALT: ${DEID_HMAC_SALT}
      DEID_VAULT_KEY: ${DEID_VAULT_KEY}
      DEID_DATABASE_URL: postgresql://deid_svc:${DEID_DB_PASSWORD}@scout-db:5432/scoutoss
    volumes:
      - gateway-spool:/spool
    labels: { scoutoss.service: deid-gateway }
    depends_on:
      scout-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  indexer:
    <<: *hardening
    build: { context: ., dockerfile: services/indexer/Dockerfile }
    image: scoutoss/indexer:${SCOUTOSS_TAG:-dev}
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *python-env
      PORT: "8000"
      AUTH_AUDIENCE: scoutoss-indexer
      DATABASE_URL: postgresql://scout_app:${SCOUT_APP_DB_PASSWORD}@scout-db:5432/scoutoss
      DEID_DATABASE_URL: postgresql://deid_svc:${DEID_DB_PASSWORD}@scout-db:5432/scoutoss
      DEID_HMAC_SALT: ${DEID_HMAC_SALT}
      DEID_VAULT_KEY: ${DEID_VAULT_KEY}
      INDEXER_SOURCE: xnat
      INDEXER_POLL_SECONDS: "5"
      XNAT_USER: scout_indexer
      XNAT_PASSWORD: ${XNAT_INDEXER_PASSWORD}
      INDEXER_WEBHOOK_TOKEN: ${INDEXER_WEBHOOK_TOKEN}
    labels: { scoutoss.service: indexer }
    depends_on:
      scout-db: { condition: service_healthy }
      opensearch: { condition: service_healthy }

  copilot:
    <<: *hardening
    build: { context: ., dockerfile: services/copilot/Dockerfile }
    image: scoutoss/copilot:${SCOUTOSS_TAG:-dev}
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *python-env
      PORT: "8000"
      AUTH_AUDIENCE: scoutoss-copilot
      DATABASE_URL: postgresql://copilot_app:${COPILOT_DB_PASSWORD}@scout-db:5432/scoutoss
      INDEXER_URL: http://indexer:8000
      TOKEN_URL: http://keycloak:8080/realms/scoutoss/protocol/openid-connect/token
      CLIENT_ID: scoutoss-copilot
      CLIENT_SECRET: ${KC_COPILOT_CLIENT_SECRET}
      XNAT_PIPELINE_USER: scout_pipeline
      XNAT_PIPELINE_PASSWORD: ${XNAT_PIPELINE_PASSWORD}
      LLM_PROVIDER: ${LLM_PROVIDER:-heuristic}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    labels: { scoutoss.service: copilot }
    depends_on:
      scout-db: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  ui:
    <<: *hardening
    build: { context: services/ui }
    image: scoutoss/ui:${SCOUTOSS_TAG:-dev}
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    environment:
      KEYCLOAK_PUBLIC_URL: https://auth.localhost:${HTTPS_PORT:-24443}
      KEYCLOAK_REALM: scoutoss
      KEYCLOAK_CLIENT_ID: scoutoss-ui
      DEFAULT_PROJECT: ${DEFAULT_PROJECT:-SCOUT_DEMO}
    labels: { scoutoss.service: ui }

  notebooks:
    <<: *hardening
    build: { context: services/notebooks }
    image: scoutoss/notebooks:${SCOUTOSS_TAG:-dev}
    environment:
      PUBLIC_APP_URL: https://app.localhost:${HTTPS_PORT:-24443}
      KEYCLOAK_PUBLIC_ISSUER: https://auth.localhost:${HTTPS_PORT:-24443}/realms/scoutoss
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/scoutoss
      OAUTH_CLIENT_ID: scoutoss-notebooks
      OAUTH_CLIENT_SECRET: ${KC_NOTEBOOKS_CLIENT_SECRET}
    volumes:
      - notebooks:/home/jovyan/work
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/notebooks/hub/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels: { scoutoss.service: notebooks }
    depends_on:
      keycloak: { condition: service_healthy }

  # HL7v2 interface engine (Mirth Connect 4.5.2, the last MPL-licensed release).
  mirth:
    <<: *hardening
    image: nextgenhealthcare/connect:4.5.2
    ports:
      - "127.0.0.1:${MLLP_PORT:-26661}:6661"
    environment:
      DATABASE: postgres
      DATABASE_URL: jdbc:postgresql://scout-db:5432/mirthdb
      DATABASE_USERNAME: mirth
      DATABASE_PASSWORD: ${MIRTH_DB_PASSWORD}
      DATABASE_MAX_CONNECTIONS: "20"
      VMOPTIONS: -Xmx512m
      KC_TOKEN_URL: http://keycloak:8080/realms/scoutoss/protocol/openid-connect/token
      KC_MIRTH_CLIENT_ID: scoutoss-mirth
      KC_MIRTH_CLIENT_SECRET: ${KC_MIRTH_CLIENT_SECRET}
      INDEXER_URL: http://indexer:8000
      SCOUT_PROJECT: ${DEFAULT_PROJECT:-SCOUT_DEMO}
    volumes:
      - mirth-appdata:/opt/connect/appdata
    labels: { scoutoss.service: mirth }
    depends_on:
      scout-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://localhost:8443/api/server/version -H 'X-Requested-With: OpenAPI' -w '%{http_code}' | grep -qE '200|401' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  # ------------------------------------------------------------------ one-shot bootstrap jobs
  opensearch-setup:
    image: scoutoss/indexer:${SCOUTOSS_TAG:-dev}
    restart: "no"
    command: ["python", "/bootstrap/scripts/bootstrap/opensearch.py"]
    environment:
      BOOTSTRAP_ROOT: /bootstrap
      OPENSEARCH_URL: http://opensearch:9200
      DASHBOARDS_URL: http://opensearch-dashboards:5601/dashboards
    volumes:
      - ./scripts:/bootstrap/scripts:ro
      - ./dashboards:/bootstrap/dashboards:ro
    depends_on:
      indexer: { condition: service_healthy }
      opensearch-dashboards: { condition: service_healthy }

  xnat-setup:
    image: scoutoss/indexer:${SCOUTOSS_TAG:-dev}
    restart: "no"
    command: ["python", "/bootstrap/scripts/bootstrap/xnat.py"]
    environment:
      BOOTSTRAP_ROOT: /bootstrap
      XNAT_URL: http://xnat-web:8080
      XNAT_PUBLIC_URL: https://xnat.localhost:${HTTPS_PORT:-24443}
      DEFAULT_PROJECT: ${DEFAULT_PROJECT:-SCOUT_DEMO}
      XNAT_ADMIN_PASSWORD: ${XNAT_ADMIN_PASSWORD}
      XNAT_INDEXER_PASSWORD: ${XNAT_INDEXER_PASSWORD}
      XNAT_PIPELINE_PASSWORD: ${XNAT_PIPELINE_PASSWORD}
      XNAT_ARCHIVER_PASSWORD: ${XNAT_ARCHIVER_PASSWORD}
      JOB_ENGINE_URL: tcp://job-engine:2375
    volumes:
      - ./scripts:/bootstrap/scripts:ro
      - ./xnat:/bootstrap/xnat:ro
    depends_on:
      xnat-web: { condition: service_healthy }
      pipeline-images: { condition: service_completed_successfully }

  mirth-setup:
    image: scoutoss/indexer:${SCOUTOSS_TAG:-dev}
    restart: "no"
    command: ["python", "/bootstrap/scripts/bootstrap/mirth.py"]
    environment:
      BOOTSTRAP_ROOT: /bootstrap
      MIRTH_URL: https://mirth:8443
      MIRTH_ADMIN_PASSWORD: ${MIRTH_ADMIN_PASSWORD}
    volumes:
      - ./scripts:/bootstrap/scripts:ro
      - ./services/hl7-gateway:/bootstrap/services/hl7-gateway:ro
    depends_on:
      mirth: { condition: service_healthy }

  # Builds pipeline images inside the isolated job engine so XNAT can launch them.
  pipeline-images:
    image: docker:29.0.4-cli
    restart: "no"
    environment:
      DOCKER_HOST: tcp://job-engine:2375
    command: ["sh", "-c", "docker build -q -t scoutoss/qc:0.1.0 /pipelines/qc && docker image ls scoutoss/qc"]
    volumes:
      - ./services/pipelines:/pipelines:ro
    depends_on:
      job-engine: { condition: service_healthy }

volumes:
  scout-db:
  xnat-db:
  xnat-home:
  xnat-archive:
  xnat-prearchive:
  xnat-build:
  xnat-cache:
  job-engine:
  opensearch:
  gateway-spool:
  dicom-dest:
  mirth-appdata:
  prometheus:
  grafana:
  filebeat:
  notebooks:
