server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://auth.localhost:*; frame-src 'self' https://auth.localhost:*; frame-ancestors 'self'" always;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location = /config.js { alias /tmp/config.js; add_header Cache-Control "no-store"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
