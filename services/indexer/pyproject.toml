[project]
name = "scoutoss-indexer"
version = "0.1.0"
description = "ScoutOSS indexer: XNAT/DICOM metadata -> OpenSearch, de-identification gateway, clinical ingest"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scoutoss-common",
    "pydicom>=3.0",
    "pynetdicom>=2.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "cryptography>=43",
    "hl7>=0.4.5",
]

[project.scripts]
scoutoss-indexer = "scoutoss_indexer.__main__:main"
scoutoss-deid-gateway = "scoutoss_indexer.gateway:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scoutoss_indexer"]
